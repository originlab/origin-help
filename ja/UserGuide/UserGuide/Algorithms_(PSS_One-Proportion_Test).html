<h3><a name="Sample_Size"></a><span class="mw-headline">サンプルサイズ</span></h3>
<p>Origin は、検出力の式を使用した反復アルゴリズムを使用します。各反復で試行標本サイズに対する検出力を評価し、整数の標本サイズに対応する検出力のうち、目標値より大きく、かつ目標値に最も近い値に達した時点で反復を終了します。
</p>
